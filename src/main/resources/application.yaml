spring:
  application:
    name: order-flow-application

  datasource:
    url: jdbc:postgresql://localhost:5432/orderflow_db
    username: kaiser
    password: password
    driver-class-name: org.postgresql.Driver

  data:
    mongodb:
      uri: mongodb://localhost:27017/orderflow_logs

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: validate
    show-sql: true

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
    url: jdbc:postgresql://localhost:5432/orderflow_db
    user: Kaiser
    password: password

  session:
    store-type: jdbc
    jdbc:
      initialize-schema: never
      table-name: SPRING_SESSION

  graphql:
    graphiql:
      enabled: true

app:
  cleanup:
    soft-delete-retention-days: 30